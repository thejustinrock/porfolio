    <h1>Contact</h1>
    <p>Use the form below to contact me.</p>

    <form action="mailto:YOUR_EMAIL@example.com"
          method="POST"
          enctype="text/plain">

        <p>
            <label>
                Your email:
                <input type="email" name="email">
            </label>
        </p>

        <p>
            <label>
                Subject:
                <input type="text" name="subject">
            </label>
        </p>

        <p>
            <label>
                Message:
                <textarea name="body" rows="5"></textarea>
            </label>
        </p>

        <button type="submit">Send</button>
    </form>
</body>
